services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aluguel
      POSTGRES_USER: aluguel
      POSTGRES_PASSWORD: aluguel_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aluguel -d aluguel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
